<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="t d" font-family="Assistant, 'Segoe UI', Arial, sans-serif">
<title id="t">AI Portfolio Kit architecture</title>
<desc id="d">The visitor's browser loads the frontend from Cloudflare Pages and sends API calls to the edge Worker. The Worker checks Turnstile, adds a shared secret and forwards each call to the FastAPI backend on Cloud Run. The backend reads the Markdown corpus in backend/docs, calls the Gemini API, sends contact mail over SMTP, books calls on cal.com and receives its secrets from Secret Manager.</desc>
<defs>
<pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#d5dff4" stroke-width="1"/></pattern>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0c1a44"/></marker>
</defs>
<rect width="960" height="400" fill="#e9effb"/><rect width="960" height="400" fill="url(#g)"/>
<text x="32" y="46" font-size="13" font-weight="700" fill="#1f45f0" letter-spacing=".5">ARCHITECTURE</text>
<text x="32" y="78" font-size="26" font-weight="800" fill="#0c1a44">One backend, a folder of markdown, no database.</text>
<g font-size="13" fill="#4f5c7c">
<rect x="32" y="112" width="200" height="76" rx="8" fill="#fff" stroke="#0c1a44" stroke-width="2"/>
<text x="52" y="142" font-size="17" font-weight="800" fill="#0c1a44">Visitor's browser</text><text x="52" y="166">chat, booking, contact</text>
<rect x="32" y="232" width="200" height="76" rx="8" fill="#fff" stroke="#0c1a44" stroke-width="2"/>
<text x="52" y="262" font-size="17" font-weight="800" fill="#0c1a44">Cloudflare Pages</text><text x="52" y="286">React site, prerendered</text>
<rect x="290" y="112" width="200" height="76" rx="8" fill="#fff" stroke="#0c1a44" stroke-width="2"/>
<text x="310" y="142" font-size="17" font-weight="800" fill="#0c1a44">Edge Worker</text><text x="310" y="166">Turnstile, adds the secret</text>
<rect x="548" y="112" width="200" height="196" rx="8" fill="#0c1a44" stroke="#0c1a44" stroke-width="2"/>
<text x="568" y="142" font-size="17" font-weight="800" fill="#fff">Cloud Run backend</text>
<text x="568" y="166" fill="#d5dff4">FastAPI, one process</text>
<text x="568" y="198" fill="#ffc83d" font-weight="700">selection.py</text><text x="568" y="216" fill="#d5dff4">picks the documents</text>
<text x="568" y="246" fill="#ffc83d" font-weight="700">guard.py</text><text x="568" y="264" fill="#d5dff4">checks input and output</text>
<text x="568" y="290" fill="#d5dff4">rate limits in memory</text>
<rect x="800" y="104" width="140" height="52" rx="8" fill="#fff" stroke="#0c1a44" stroke-width="2"/><text x="814" y="135" font-size="15" font-weight="800" fill="#0c1a44">Gemini API</text>
<rect x="800" y="170" width="140" height="52" rx="8" fill="#ffc83d" stroke="#0c1a44" stroke-width="2"/><text x="814" y="194" font-size="14" font-weight="800" fill="#0c1a44">backend/docs</text><text x="814" y="212" fill="#0c1a44">markdown</text>
<rect x="800" y="236" width="140" height="52" rx="8" fill="#fff" stroke="#0c1a44" stroke-width="2"/><text x="814" y="260" font-size="15" font-weight="800" fill="#0c1a44">SMTP</text><text x="814" y="278">contact mail</text>
<rect x="800" y="302" width="140" height="52" rx="8" fill="#fff" stroke="#0c1a44" stroke-width="2"/><text x="814" y="326" font-size="15" font-weight="800" fill="#0c1a44">cal.com</text><text x="814" y="344">booking</text>
<rect x="548" y="330" width="200" height="40" rx="8" fill="#fff" stroke="#0c1a44" stroke-width="2" stroke-dasharray="5 4"/><text x="568" y="355" font-weight="700" fill="#0c1a44">Secret Manager</text>
</g>
<g stroke="#0c1a44" stroke-width="2" fill="none" marker-end="url(#a)">
<path d="M132 190V228"/><path d="M234 150H286"/><path d="M492 150H544"/>
<path d="M750 130H796"/><path d="M750 196H796"/><path d="M750 262H796"/><path d="M750 300L796 326"/>
<path d="M648 326V312" stroke-dasharray="5 4"/>
</g>
<g font-size="12" fill="#0c1a44" font-weight="700"><text x="140" y="214">loads the site</text><text x="240" y="140">API</text><text x="494" y="140">+ secret</text></g>
</svg>
