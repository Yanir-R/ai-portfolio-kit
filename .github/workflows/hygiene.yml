name: hygiene
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check for private paths, addresses, hostnames, identifiers and credential shapes
        run: bash .github/scripts/check_hygiene.sh
