<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <!-- viewport-fit=cover lets the page paint under the notch and home
             indicator rather than being letterboxed by them. No maximum-scale
             or user-scalable: either one blocks pinch zoom. -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

        <!-- Icons. favicon.svg is the mark; the PNGs are for what cannot read
             SVG: Google's search results want a square of a multiple of 48px,
             and iOS home screens use apple-touch-icon. Source and how to
             regenerate the PNGs: tools/favicon.html. -->
        <link rel="icon" href="/favicon.ico" sizes="48x48" />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <meta name="theme-color" content="#0C1A44" />

        <!-- Everything between the seo:head markers is per-route. This copy is
             the home page's; at build time seo/prerender.mts writes one HTML
             file per route (about, projects, blog and every post and project)
             with this block replaced. Keep the markers. -->
        <!-- seo:head:start -->
        <title>Yanir Rot | AI agents and systems for businesses</title>
        <meta name="title" content="Yanir Rot | AI agents and systems for businesses" />
        <meta
            name="description"
            content="The assistant answers as me, from my notes and project write-ups. When they don’t cover your question it says so rather than guessing."
        />
        <meta name="author" content="Yanir Rot" />

        <!-- %VITE_SITE_URL% is substituted at build time by vite.config.mts,
             from `url` in site.config.ts. Change it there rather than
             hardcoding a host in this markup. -->
        <link rel="canonical" href="%VITE_SITE_URL%/" />

        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Yanir Rot" />
        <meta property="og:locale" content="en_US" />
        <meta property="og:url" content="%VITE_SITE_URL%/" />
        <meta property="og:title" content="Yanir Rot | AI agents and systems for businesses" />
        <meta
            property="og:description"
            content="The assistant answers as me, from my notes and project write-ups. When they don’t cover your question it says so rather than guessing."
        />
        <!-- LinkedIn treats og:image as required, not optional: without it the
             Featured-section card renders blank and the link-preview fetch
             reports no preview at all. The asset is public/og-image.png at
             1200x630, which clears LinkedIn's 1200x627 minimum and its 5MB cap.
             Regenerate it from tools/og-image.html - see that file's header.

             The URL must be absolute; crawlers do not resolve relative paths
             here, which is why it goes through the same build-time placeholder
             as og:url rather than being written as "/og-image.png". -->
        <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
        <meta property="og:image:type" content="image/png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta
            property="og:image:alt"
            content="Yanir Rot, AI agent developer: I build AI products end to end, then make them trustworthy."
        />

        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:url" content="%VITE_SITE_URL%/" />
        <meta name="twitter:title" content="Yanir Rot | AI agents and systems for businesses" />
        <meta
            name="twitter:description"
            content="The assistant answers as me, from my notes and project write-ups. When they don’t cover your question it says so rather than guessing."
        />
        <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

        <!-- Structured data, and the only description of Yanir that a crawler
             which does not run JavaScript sees on this page. Built from
             seo/facts.mts at build time so the facts live in one place; the
             per-route files carry their own graph for the post or project.

             No `email` property, deliberately. A structured-data block is the
             most machine-readable place on the internet to publish an address,
             parsed by everything including the scrapers that harvest them.
             Someone who wants to make contact has the assistant and the Email
             button, which reach the same inbox. -->
        <!-- seo:jsonld -->
        <!-- seo:head:end -->
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
